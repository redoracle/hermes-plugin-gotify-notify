name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests and coverage
        run: python -m pytest tests/ --cov=gotify_notify --cov-report=term-missing --cov-fail-under=95

  lint:
    name: Static checks and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check gotify_notify tests
      - run: python -m compileall -q gotify_notify tests scripts
      - name: Verify release preparation script syntax and permissions
        run: |
          test -x scripts/prepare-release.sh
          bash -n scripts/prepare-release.sh
      - name: Check release metadata versions
        run: python scripts/sync_version.py --check
      - name: Validate packaging metadata
        run: python -m pip check

  androidctl:
    name: Android utility unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify Android entry points remain identical
        run: cmp utils/gotify-androidctl/gotify-androidctl utils/gotify-androidctl/gotify-androidctl.py
      - run: python -m unittest discover -s utils/gotify-androidctl/tests -p 'test_androidctl.py' -v
      - name: Install FFmpeg and FFprobe for real audio conversion coverage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Provision apps, authenticate notifications, rotate tokens, and validate assets
        env:
          GOTIFY_REQUIRE_FFMPEG: "1"
        run: bash utils/gotify-androidctl/selftest.sh

  release-notes:
    name: Release-notes compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install release tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test conventional release notes against the installed writer
        run: npm run test:release-notes

  gotify-integration:
    name: Actual Gotify / v${{ matrix.gotify-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gotify-version: ["2.9.1", "3.1.1"]
    services:
      gotify:
        image: gotify/server:${{ matrix.gotify-version }}
        ports:
          - 8090:80
        env:
          GOTIFY_DEFAULTUSER_PASS: ci-disposable-gotify-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tested package and pytest
        run: python -m pip install -e ".[dev]"
      - name: Persist notifications in disposable Gotify and verify auth boundary
        env:
          GOTIFY_TEST_URL: http://127.0.0.1:8090
          GOTIFY_TEST_ADMIN_PASSWORD: ci-disposable-gotify-password
          NO_PROXY: 127.0.0.1,localhost
        run: python -m pytest integration/test_real_gotify.py -v
