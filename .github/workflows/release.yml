name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python for release metadata checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify synchronized release metadata
        run: python scripts/sync_version.py --check

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install release dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify compatible release-notes generator
        run: npm run test:release-notes

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
