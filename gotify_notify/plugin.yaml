name: gotify-notify
version: "1.0.0"
description: >-
  Send high-value Hermes notifications to Gotify with markdown rendering.
  Configurable via GOTIFY_CONTENT_TYPE env var.
author: redoracle
license: MIT
homepage: https://github.com/redoracle/hermes-plugin-gotify-notify
provides_tools:
  - gotify_send
requires_env:
  - name: GOTIFY_URL
    description: Gotify server base URL (e.g. http://gotify.local)
  - name: GOTIFY_APP_TOKEN
    description: Gotify application token
    secret: true
optional_env:
  - name: GOTIFY_CONTENT_TYPE
    description: Content-Type for message rendering (text/markdown or text/plain)
    default: text/markdown
  - name: GOTIFY_TIMEOUT
    description: Request timeout in seconds (1-60)
    default: "10"
